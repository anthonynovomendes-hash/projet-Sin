<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GROWLINK | Stats</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="container">
            <div class="logo">GROWLINK</div>
            <nav>
                <ul>
                    <li><a href="index.html">Accueil</a></li>
                    <li><a href="Stats.html">Stats</a></li>
                    <li><a href="Geston manuelle.html">Gestion manuelle</a></li>
                    <li><a href="Programmation.html">Programmation</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="services">
        <div class="container">
            <h2>Statistiques de la serre</h2>
            <p>Visualisez ici vos graphiques de température, d'humidité et d'ensoleillement.</p>
        </div>
        <div>
  <p>Température : <span id="temp">--</span> °C</p>
  <p>Humidité : <span id="hum">--</span> %</p>
  <p>Dernière mise à jour : <span id="maj">--</span></p>
</div>

<script>
  const url = "https://firebasedatabase.app";

  function chargerDonnees() {
    fetch(url)
      .then(response => response.json())
      .then(data => {
        if (data) {
          document.getElementById("temp").innerText = data.temperature;
          document.getElementById("hum").innerText = data.humidite;
          document.getElementById("maj").innerText = data.timestamp;
        }
      });
  }

  chargerDonnees();
  setInterval(chargerDonnees, 10000);
</script>

    </section>

    <footer>
    </footer>

</body>
</html>
